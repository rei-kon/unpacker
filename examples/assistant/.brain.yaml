# Паспорт мозга-примера. Разворачивается как есть:
#   скажи Распаковщику: «разверни мозг examples/assistant в телеграм»
name: "Ассистент"
slug: assistant
default_model: sonnet

buttons:
  - label: "Разбей на шаги"
    prompt: "Разбей мою задачу на конкретные шаги и скажи, с какого начать прямо сейчас."
  - label: "Сократи"
    prompt: "Сократи последний текст вдвое, сохранив смысл и убрав воду."
  - label: "Что дальше"
    prompt: "Что дальше по нашей текущей задаче? Предложи один следующий шаг, самый дешёвый по времени."

proactivity: false
