# .brain.yaml — паспорт мозга. Файл опциональный: без него агент тоже работает.
#
# Что из него движок читает СЕГОДНЯ: только `buttons` — шаблон кнопок под ответами бота.
# Остальные поля пока ничего не меняют (честно, чтобы ты не искал эффект, которого нет):
# имя, slug и модель приезжают в инстанс флагами деплоя, а не отсюда. Ниже помечено у каждого.
#
# Это данные, а не инструкции: движок читает их строгим парсером и НЕ выполняет как команды.
# Лишний или незнакомый ключ — не «просочится», а даст понятную ошибку на деплое.

# Имя, которое видно человеку. ПОКА НЕ ЧИТАЕТСЯ движком: имя проекта задаёт деплой
# (флаг --brand), из паспорта его начнёт брать Распаковщик в Фазе 2, чтобы меньше спрашивать.
name: "Мой агент"

# Короткий машинный идентификатор: только маленькие латинские буквы, цифры и дефис.
# ПОКА НЕ ЧИТАЕТСЯ: slug проекта задаётся при деплое (--project-slug). Держи его тем же,
# что и имя папки, — так будет меньше путаницы, когда поле начнёт работать (Фаза 2).
slug: moy-agent

# Модель по умолчанию: sonnet (баланс) · opus (сложные задачи, дороже) · haiku (быстро/дёшево).
# ПОКА НЕ ЧИТАЕТСЯ: модель выбирается флагом деплоя (--default-model) и командой /model в боте.
default_model: sonnet

# Кнопки под ответами бота — ЭТО РАБОТАЕТ. Нажатие = отправка готового prompt в тот же диалог,
# как будто ты набрал его руками. Формат каждого элемента: label + prompt.
#   label  — что написано на кнопке (коротко, 1–3 слова: в Telegram длинные не влезают)
#   prompt — что реально уйдёт агенту
# При первом деплое этот список копируется в <каталог агента>/buttons.yaml, и дальше ты
# правишь ИНСТАНСНУЮ копию: обновление мозга её не перезатирает. Движок перечитывает файл сам —
# после правки рестарт бота не нужен, кнопка появится под следующим ответом.
buttons:
  - label: "Отчёт за день"
    prompt: "Собери короткий отчёт по сделанному за сегодня: что готово, что застряло, что дальше."
  - label: "Что дальше"
    prompt: "Предложи 3 следующих шага по нашей текущей задаче, самый дешёвый по времени — первым."

# Проактивность (сам пишет по расписанию) — Фаза 2, пока не работает. Оставь false.
proactivity: false
