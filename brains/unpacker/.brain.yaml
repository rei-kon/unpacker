# Паспорт мозга (§4). Читается ТИПИЗИРОВАННЫМ парсером: это данные под схемой, а не инструкции.
# buttons — шаблон кнопок-триггеров. При первом деплое он копируется в buttons.yaml инстанса
# (мост: python -m engine.brainkit export-buttons), дальше владелец правит инстансную копию,
# и повторный деплой её НЕ перезатирает — та же дисциплина, что у .env.
name: "Распаковщик"
slug: unpacker
default_model: sonnet
proactivity: false
buttons:
  - label: "Развернуть агента"
    prompt: "Хочу развернуть агента в Telegram. Задай мне одним блоком все вопросы, которые нужны для деплоя, потом покажи план и дождись моего «да»."
  - label: "Мои боты"
    prompt: "Покажи список развёрнутых агентов и их состояние — по-человечески, без простыни логов."
  - label: "Почему бот молчит"
    prompt: "Один из ботов не отвечает. Продиагностируй и объясни причину простыми словами, потом предложи один конкретный шаг."
  - label: "Обновить движок"
    prompt: "Обнови движок до последнего релиза. Сначала план и что может сломаться, потом жди подтверждения."
  - label: "Сколько потратили"
    prompt: "Покажи расход по инстансам за сегодня и за месяц, и скажи, есть ли что-то подозрительное."
