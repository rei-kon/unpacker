name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: uv sync --extra dev

      - name: Линт
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Типы
        run: uv run mypy

      # Канарейки здесь НЕ гоняются: им нужен живой claude CLI и токен подписки.
      # Их место — make canary на VPS (см. README).
      - name: Юнит-тесты ядра
        run: uv run pytest
