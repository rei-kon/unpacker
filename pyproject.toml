[project]
name = "unpacker-engine"
version = "0.1.0"
description = "«Распаковщик» — движок агентов на Claude Agent SDK (ядро)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    # Точный пин, а не >=: 0.2.121 несёт фикс «Stream closed» на долгих MCP-вызовах
    # (python #676/#730). Версия поднимается осознанно релизом по тегу, иначе новый
    # релиз SDK молча приедет ученику на VPS и сломает живого бота.
    "claude-agent-sdk==0.2.121",
    "telegramify-markdown>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Только юнит-тесты. canaries/ живут вне testpaths: им нужен живой claude CLI,
# токен подписки и Linux — в CI их гонять нечем (make canary на VPS).
testpaths = ["engine/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["engine"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
