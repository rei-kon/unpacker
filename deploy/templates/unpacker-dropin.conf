# systemd drop-in для юнита мета-агента «Распаковщик» (§7.5).
# Кладётся в /etc/systemd/system/agent-tg@<name>.service.d/10-unpacker.conf — базовый
# agent-tg@.service НЕ правится: обычные агенты остаются под NoNewPrivileges=true.
#
# Зачем drop-in, а не отдельный юнит: имя юнита agent-tg@<name> — контракт (agentctl,
# update.sh, sudoers-whitelist смотрят на него). Отдельный юнит для Распаковщика развёл бы
# инструменты по двум именам, и «почему бот молчит» перестало бы работать.
[Service]
# sudo — setuid-бинарь: под NoNewPrivileges он физически не может стать root, и Распаковщик
# молча терял бы возможность разворачивать ботов. Снимаем ИМЕННО этот флаг, остальное — держим.
NoNewPrivileges=no
# /usr и /boot только на чтение, /etc — тоже, кроме явных исключений ниже.
ProtectSystem=full
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
PrivateTmp=true
# ProtectSystem=full делает /etc read-only ДЛЯ ВСЕЙ cgroup, включая root-детей через sudo →
# без этих исключений deploy.sh не смог бы поставить юнит нового бота и sudoers-файл.
ReadWritePaths=/etc/systemd/system /etc/sudoers.d
# Ограниченный набор возможностей: ровно то, без чего sudo и провижининг файлов не работают.
#   SETUID/SETGID — sudo меняет uid/gid;   CHOWN/FOWNER/DAC_OVERRIDE — install/chown чужих файлов;
#   KILL — остановка юнитов;               AUDIT_WRITE — sudo пишет запись в аудит.
# Всё остальное (SYS_ADMIN, SYS_MODULE, SYS_PTRACE, NET_RAW, …) недоступно даже root-детям.
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_CHOWN CAP_FOWNER CAP_DAC_OVERRIDE CAP_KILL CAP_AUDIT_WRITE
